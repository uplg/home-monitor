[package]
name = "maison-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
default-run = "maison-backend"

[features]
default = ["bluetooth"]
bluetooth = ["dep:btleplug"]
live-runtime-tests = []

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
btleplug = { version = "0.12.0", optional = true }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
# The uplg forks track upstream (PaulmannLighting) plus robustness fixes and
# the EZSP <= v13 legacy importTransientKey wire format for the MG21 dongle.
# ashv2's `ezsp` feature provides the Transmit/Receive adapters; the ezsp
# crate itself resolves through [patch.crates-io] below so both the direct
# dependency and ashv2's internal one use the same patched source.
ashv2 = { git = "https://github.com/uplg/ashv2/", branch = "main", version = "12.0.0", features = ["ezsp"] }
ezsp = "15.0.0"
silizium = { version = "3", features = ["le-stream"] }
futures = "0.3.34"
heapless = "0.9"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
md5 = "0.8.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "form"] }
rbroadlink = "0.4.2"
rust-async-tuyapi = { git = "https://github.com/uplg/rust-async-tuyapi", rev = "6cd9180b296a04ef9e6751b594c6235aa79b7157" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-serial = "5.5.0"
tower-http = { version = "0.7.0", features = ["cors", "fs", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
bytes = "1.12.1"
tempfile = "3.27.0"
tower = "0.5.3"
uuid = { version = "1.25.0", features = ["v4"] }

[patch.crates-io]
ezsp = { git = "https://github.com/uplg/ezsp", branch = "main" }
