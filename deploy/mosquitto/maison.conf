# Host-native Mosquitto config for maison on Raspberry Pi

# Local plaintext listener for local debugging
listener 1883 0.0.0.0

# TLS listener required by Meross devices
listener 8883 0.0.0.0
cafile /etc/mosquitto/certs/maison/ca.pem
certfile /etc/mosquitto/certs/maison/server.pem
keyfile /etc/mosquitto/certs/maison/server-key.pem

allow_anonymous true

log_dest file /var/log/mosquitto/mosquitto.log
log_type warning
log_type error
